<?xml version="1.0" encoding="UTF-8"?>
<!--
  YouTube thumbnail template, 1280x720. Filled by scripts/render.py; the
  {{TOKENS}} are replaced. Opens in Inkscape or a browser after filling.

  Layers, bottom to top:
    1. background photo, zoomed past the frame and heavily blurred
    2. darkening overlay so the title reads
    3. character cutout with a white sticker outline and soft shadow
    4. IGN-style title block: colored title block over a dark drop block,
       then a light or dark subtitle block, colors chosen by render.py
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- Heavy blur plus a small saturation lift. The image is scaled past the
         frame so the blur's faded edges fall outside the viewport. -->
    <filter id="bg-blur" x="-10%" y="-10%" width="120%" height="120%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="{{BLUR}}"/>
      <feColorMatrix type="saturate" values="{{SATURATE}}"/>
    </filter>

    <!-- Sticker outline: dilate the alpha, flood it white, put the original on
         top. A blurred, offset copy of the dilated alpha is the drop shadow.
         radius is in canvas pixels because the image has no transform. -->
    <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="{{OUTLINE}}" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result="outline"/>
      <feGaussianBlur in="dilated" stdDeviation="14" result="shadow-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55" result="black"/>
      <feComposite in="black" in2="shadow-blur" operator="in" result="shadow"/>
      <feOffset in="shadow" dx="0" dy="16" result="shadow-offset"/>
      <feMerge>
        <feMergeNode in="shadow-offset"/>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="{{DIM_LEFT}}"/>
      <stop offset="1" stop-color="#000000" stop-opacity="{{DIM_RIGHT}}"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="1280" height="720"/>
    </clipPath>
  </defs>

  <!-- 1. background -->
  <g clip-path="url(#frame)">
    <g transform="translate(640 360) scale({{BG_ZOOM}}) translate(-640 -360)">
      <image xlink:href="{{BG_HREF}}" x="0" y="0" width="1280" height="720"
             preserveAspectRatio="xMidYMid slice" filter="url(#bg-blur)"/>
    </g>
  </g>

  <!-- 2. overlay -->
  <rect width="1280" height="720" fill="url(#dim)"/>

  <!-- 3. character -->
  <g clip-path="url(#frame)">
    <image xlink:href="{{CHAR_HREF}}" x="{{CHAR_X}}" y="{{CHAR_Y}}"
           width="{{CHAR_W}}" height="{{CHAR_H}}"
           preserveAspectRatio="xMidYMid meet" filter="url(#sticker)"/>
  </g>

  <!-- 4. title block -->
  <g font-family="Anton, 'Montserrat', 'Arial Narrow', sans-serif">
{{TITLE_BLOCK}}
  </g>
</svg>
