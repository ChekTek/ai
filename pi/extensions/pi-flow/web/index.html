<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="data:," />
		<title>pi-flow</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body data-flow-token="%%FLOW_TOKEN%%">
		<header class="toolbar">
			<div class="brand">
				<span class="brand-mark"></span>
				<span class="brand-name">pi&#8203;-flow</span>
			</div>
			<div class="session">
				<span id="session-name" class="session-name">Loading session…</span>
				<span id="session-meta" class="session-meta"></span>
			</div>
			<div class="actions">
				<button id="fit" type="button" title="Fit graph to viewport (F)">Fit view</button>
				<button id="zoom-out" type="button" title="Zoom out (-)">&minus;</button>
				<button id="zoom-in" type="button" title="Zoom in (+)">&plus;</button>
				<button id="auto" type="button" class="toggle on" title="Resume Auto camera (crosshair)">Auto</button>
				<span id="connection" class="pill pill-offline">connecting</span>
			</div>
		</header>

		<main class="stage" id="stage">
			<svg class="edges" id="edges" aria-hidden="true">
				<g id="edge-layer"></g>
			</svg>
			<div class="nodes" id="nodes"></div>
			<div class="empty" id="empty">
				<p>No conversation yet. Send a prompt here or in Pi to populate the graph.</p>
				<form class="node-prompt empty-prompt" id="empty-prompt">
					<textarea
						class="node-prompt-input"
						id="empty-prompt-input"
						rows="3"
						placeholder="Message Pi…"
					></textarea>
					<div class="node-prompt-actions">
						<button type="submit" class="node-prompt-send">Send</button>
						<span class="node-prompt-hint">Enter to send · Shift+Enter to steer while busy</span>
					</div>
				</form>
			</div>
		</main>

		<aside class="inspector" id="inspector" hidden>
			<button class="inspector-close" id="inspector-close" type="button" title="Close (Esc)">&times;</button>
			<h2 id="inspector-title"></h2>
			<p class="inspector-subtitle" id="inspector-subtitle"></p>
			<div class="inspector-badges" id="inspector-badges"></div>
			<div class="inspector-actions" id="inspector-actions" hidden>
				<button type="button" id="nav-edit">Edit prompt</button>
				<button type="button" id="nav-continue">Continue here</button>
				<label class="inspector-label">
					Label
					<input id="nav-label" type="text" placeholder="bookmark" />
				</label>
			</div>
			<pre class="inspector-body" id="inspector-body"></pre>
		</aside>

		<footer class="legend">
			<span><i class="swatch swatch-user"></i>user</span>
			<span><i class="swatch swatch-assistant"></i>assistant</span>
			<span><i class="swatch swatch-tool"></i>tool</span>
			<span><i class="swatch swatch-context"></i>context</span>
			<span class="legend-hint">drag background to pan · wheel to zoom · drag a card to move it</span>
		</footer>

		<script type="module" src="/js/app.js"></script>
	</body>
</html>
